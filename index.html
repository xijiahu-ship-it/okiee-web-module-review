const modules=window.REVIEW_MODULES,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={keep:'保留',change:'改造',add:'新增'};let current='ai',screen=0,mode='before',selected=0,filterMode='l2',tab='modules';
function route(){const hash=location.hash.slice(1).split('/');tab=['overview','changes'].includes(hash[0])?hash[0]:'modules';if(tab==='modules'&&modules.some(m=>m.id===hash[1]))current=hash[1];screen=0;selected=0;render();}
function navigate(id){mode='before';location.hash='modules/'+id;}
function badge(type){return `<span class="status-pill">${labels[type]}</span>`;}
function marksHTML(m,s,zoom=false){return `<div class="annotated"><img src="${window.REVIEW_IMAGES?.[s.image]||'assets/'+s.image+'.png'}" alt="daily-picks 原 demo：${esc(m.title)} · ${esc(s.name)}，2026年10月29日截图">${s.marks.map((a,i)=>`<button class="mark ${a.type} ${selected===i?'selected':''}" style="left:${a.x}%;top:${a.y}%;width:${a.w}%;height:${a.h}%" data-mark="${i}" aria-label="标注 ${i+1}：${esc(a.title)}" aria-pressed="${selected===i}"><span>${i+1}</span>${a.type==='add'?'<i class="mark-label">＋ 拟新增位置</i>':''}</button>`).join('')}</div>`;}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});if(tab==='overview')return overview();if(tab==='changes')return changes();const m=modules.find(x=>x.id===current),s=m.screens[screen],idx=modules.indexOf(m);$('#app').innerHTML=`<div class="layout"><aside class="sidenav" aria-label="前端模块"><div class="nav-label">FRONTEND MODULES</div>${modules.map(x=>`<button class="module-link ${x.id===current?'active':''}" data-module="${x.id}" aria-current="${x.id===current?'page':'false'}"><span class="num">${x.n}</span>${x.title}</button>`).join('')}<p class="side-foot">点圈选编号，查看对应修改。<br>虚线框表示拟新增位置。<br>原图与结构示意可切换。</p></aside><section class="workspace"><div class="module-header"><div><div class="module-index">MODULE ${m.n} / ${String(modules.length).padStart(2,'0')} · ${m.ksp}</div><h1>${m.title}</h1><p>${m.summary}</p></div><div class="pager"><button data-page="-1" ${idx===0?'disabled':''}><b>←</b> 上一模块</button><button data-page="1" ${idx===modules.length-1?'disabled':''}>下一模块 <b>→</b></button></div></div><div class="review-grid"><div class="visual-card"><div class="visual-toolbar"><div class="screen-tabs">${m.screens.map((v,i)=>`<button class="${i===screen?'active':''}" data-screen="${i}" aria-pressed="${i===screen}">${v.name}</button>`).join('')}</div><div class="mode-tabs"><button class="${mode==='before'?'active':''}" data-mode="before">现状圈选</button><button class="${mode==='after'?'active':''}" data-mode="after">调整后示意</button></div></div><div id="visual">${mode==='before'?marksHTML(m,s):mock(m)}</div><div class="visual-caption"><p>${mode==='before'?'完整原图保留；实线圈出已有区域，虚线仅标新增位置，落地时需为新增内容让位。':'仅表达目标内容结构与入口关系；这是评审示意，不代表功能已上线。'}</p>${mode==='before'?'<button data-zoom>放大原图 ↗</button>':''}</div><div class="below-visual"><small>这一模块的改版目标</small><p>${m.summary}</p></div></div><aside class="notes-card" aria-label="本模块修改说明"><div class="subheading">DEMO 当前已有</div><div class="existing">${m.existing}</div><div class="subheading">${s.name} · 对应圈选</div>${s.marks.map((a,i)=>`<article tabindex="0" class="note-item ${a.type} ${selected===i?'selected':''}" data-note="${i}"><div class="note-head"><span class="note-number">${i+1}</span><strong>${a.title}</strong>${badge(a.type)}</div><p>${a.text}</p><div class="expected"><b>改后表现 / 交互</b>${a.expected}</div></article>`).join('')}${m.caution?`<div class="caution">${m.caution}</div>`:''}<div class="source-note">需求依据：Notion ${m.source}<br>状态以原 demo 实测与源码核对为准。截图不代表推荐排序或 AI 能力已经过验证。</div></aside></div></section></div>`;}
function selectNote(n){selected=n;document.querySelectorAll('[data-mark]').forEach(e=>{e.classList.toggle('selected',Number(e.dataset.mark)===n);e.setAttribute('aria-pressed',Number(e.dataset.mark)===n?'true':'false');});document.querySelectorAll('[data-note]').forEach(e=>e.classList.toggle('selected',Number(e.dataset.note)===n));}
function overview(){$('#app').innerHTML=`<section class="mainview"><span class="page-kicker">OKIEE / WEB MODULE REVIEW</span><h1>基于现有 Demo，前端要改什么</h1><p class="intro">Notion 的需求，逐项落到 daily-picks 的页面位置。重点是补齐模块与交互，让 Smart Picks、Best Price、Track Price 各有清楚的承接。</p><div class="scope-strip">本页是一份改版评审说明：原图圈选 + 修改描述 + 调整后结构示意。原 demo 与 Notion 均未修改。</div><div class="overview-grid">${modules.map(m=>`<button class="overview-card" data-module="${m.id}"><div class="topline"><span class="num">${m.n}</span><span class="ksp">${m.ksp}</span></div><h2>${m.title}</h2><p>${m.summary}</p><span class="goto">查看圈选与说明 ↗</span></button>`).join('')}</div><div class="boundary"><h2>本次评审边界</h2><p><b>已有保留：</b>购物输入、四个 AI 入口、清单卡与勾选账单、单品 PDP、价格曲线和多商家报价。</p><p><b>本期补齐：</b>纯 Query chips、收起的盯价入口、Topic 配额与更多页、清单预算调整、Deals 筛选与反馈、购物偏好维护。</p><p><b>下期：</b>商品状态、配送、退货、详细优惠条件。评分筛选在文档中已划掉。</p><p><b>待确认：</b>清单参考价口径；折扣真伪、购买时机、降幅提醒等入口须先完成能力验收。</p></div><p class="print-note">基线：daily-picks 公开 demo 的当前方案与 2026-10-29 截图；需求：Notion「Okiee US Web 主页」。展示形式参考用户提供的逐模块／逐步骤说明页。</p></section>`;}
const extraRows=[{module:'deals',title:'商品状态、配送、退货',type:'add',phase:'next',text:'全新／翻新／二手／开箱；免运费／送达日期；支持退货／免费退货。'},{module:'deals',title:'详细优惠条件',type:'add',phase:'next',text:'with/without 券、通用优惠券、7 天内到期券；本期先保留快过期优惠快捷项。'},{module:'ai',title:'能力验收后开放的 Query',type:'add',phase:'pending',text:'折扣真假、购买时机、相对降幅提醒：文档列出，但不凭入口认定已支持。'},{module:'lists',title:'清单原价与节省金额的基准',type:'change',phase:'pending',text:'文档的各店最高报价合计，与 demo 近 30 天高价合计不同，须统一基准。'}];
function allRows(){return modules.flatMap(m=>m.screens.flatMap(s=>s.marks.map(a=>({...a,module:m.id,phase:'now',section:s.name})))).concat(extraRows);}
function changes(){$('#app').innerHTML=`<section class="mainview"><span class="page-kicker">IMPLEMENTATION CHECKLIST</span><h1>变更清单</h1><p class="intro">同一需求已按前端位置拆开。用模块与状态筛选，便于分配设计与开发工作。</p><div class="change-tools"><input id="change-search" placeholder="搜索修改点…" aria-label="搜索修改点"><select id="change-module" aria-label="按模块筛选"><option value="all">全部前端模块</option>${modules.map(m=>`<option value="${m.id}">${m.title}</option>`).join('')}</select><select id="change-phase" aria-label="按阶段筛选"><option value="all">全部阶段</option><option value="now">本期</option><option value="next">下期</option><option value="pending">待确认</option></select><span id="change-count" class="change-count"></span><button class="small-button" data-print>打印 / 存为 PDF</button></div><table class="change-table"><thead><tr><th>模块</th><th>改什么</th><th>状态 / 阶段</th><th>定位</th></tr></thead><tbody id="change-body"></tbody></table><p class="print-note">评分筛选已在 Notion 划掉，不纳入清单。自动补货仅列在基建层，未增加独立首页模块。</p></section>`;drawRows();['change-search','change-module','change-phase'].forEach(id=>document.getElementById(id).addEventListener(id==='change-search'?'input':'change',drawRows));}
function drawRows(){const q=$('#change-search').value.toLowerCase(),m=$('#change-module').value,phase=$('#change-phase').value,rows=allRows().filter(r=>(m==='all'||r.module===m)&&(phase==='all'||r.phase===phase)&&(r.title+r.text).toLowerCase().includes(q));$('#change-count').textContent=rows.length+' 项';$('#change-body').innerHTML=rows.map(r=>`<tr><td class="module-col">${modules.find(m=>m.id===r.module).title}<br><small>${r.section||''}</small></td><td><strong>${r.title}</strong>${r.text}</td><td>${labels[r.type]}<br>${{now:'本期',next:'下期',pending:'待确认'}[r.phase]}</td><td><button class="small-button" data-module="${r.module}">看圈选 ↗</button></td></tr>`).join('')||'<tr><td colspan="4">没有符合条件的修改点，请调整筛选。</td></tr>';}
function mockCard(icon,name,price,old,reason){return `<article class="mock-product"><div class="mock-photo">${icon}<span class="mock-badge">Sample price</span></div><h4>${name}</h4><div class="price">${price}${old?`<s>${old}</s>`:''}</div><p>${reason}</p><small class="mock-mini">Compare stores ↗ · ♧ Track</small></article>`;}
function mock(m){let body='';const cards=mockCard('♧','Noise-canceling headphones','$199.99','$249.99','Save $50. A quieter seat on your next flight.')+mockCard('◫','Food storage set','$19.99','$24.99','About $4 a container. Weekday lunches sorted.')+mockCard('▰','Woven throw blanket','$17.99','$29.99','40% off. A little warmth for movie night.');if(m.mock==='input')body=`<div class="mock-brand">okiee ✳</div><div class="mock-intro">Tell us what you need.</div><div class="mock-input">A cabinet under $150 for a 14-inch-deep nook…<small>＋ Attach image · Paste a product link · Add a product reference　↑</small></div><div class="mock-hint">购物任务 → Agent chat；保留输入内容、预算、链接和商品引用。</div><div class="mock-section-head"><h3>Deals for You</h3></div><div class="mock-input" style="min-height:45px">Adjust these finds: “No snacks this week”　↗</div><div class="mock-caption">下方是专门调整当前 Feed 的入口，与通用购物聊天分开。</div>`;
 if(m.mock==='ai')body=`<div class="mock-brand">okiee ✳</div><div class="mock-intro">The right pick.<br><em>The best price.</em></div><div class="mock-capabilities"><div>Compare prices ↗</div><div>Track a price ↗</div><div>Shop within budget ↗</div><div>Shopping ideas & gifts ↗</div></div><div class="mock-chips"><span>A cabinet under $150 for a 14″-deep nook? ↗</span><span>Sony XM5: which store is cheapest? ↗</span><span>Tell me when Sony XM5 is under $200 ↗</span></div><div class="mock-hint">纯文本 Query → 对应 Agent 任务；不嵌入商品卡。</div><div class="mock-columns"><div class="mock-outline"><h4>Four clear starts</h4>Compare → product<br>Track → product + target<br>Budget → need + budget<br>Gift → recipient + budget</div><div class="mock-outline"><h4>KSP in a question</h4>Smart Picks · 按约束选型<br>Best Price · 同款哪里便宜<br>Track Price · 明确目标价提醒</div></div>`;
 if(m.mock==='drops')body=`<div class="mock-section-head"><h3>Price Drops</h3><span>Tracking 3 items → Autotask ↗</span></div><div class="mock-alert"><small>YOUR PRICE IS HERE</small>Now $199.99 at Best Buy, under your $210 · See price ↗</div><div class="mock-caption">上方提醒连续 3 次未点击后收起；监控列表始终在 Autotask。</div><div class="mock-products">${cards}</div><div class="mock-hint">有／无监控：都展示运营精选低价池；个人进度不长期占据主推荐位。</div>`;
 if(m.mock==='lists'&&screen===0){const ts=[['Seasonal','Christmas Decoration List','✳ ◇ ♡','$40.97'],['Everyday category','Sunday Prep, Weeknight Ready','◫ ▤ ◫','$62.97'],['Everyday category','Coffee Shop Vibes at Home','☕ ▰ ◯','$56.97'],['Everyday category','A Simpler Morning Routine','▯ ◯ ▯','$30.97'],['Broad occasion','The Entryway Drop Zone','⌂ ◫ ♧','$39.97'],['Broad occasion','Movie Picked. Snacks Next.','▤ ☕ ▰','$30.47']];body=`<div class="mock-section-head"><h3>Shop the whole list</h3><span>Explore all lists ↗</span></div><div class="mock-topic-grid">${ts.map(t=>`<div class="mock-topic"><div class="mock-topic-art">${t[2]}</div><small>${t[0]}</small><h4>${t[1]}</h4><p>Item subtotal ${t[3]} · Save $xx</p></div>`).join('')}</div><div class="mock-caption">1 时令 + 3 通用品类 + 2 场景；首页是二级话题卡，“更多”进入全部清单页。</div>`;}
 if(m.mock==='lists'&&screen===1)body=`<div class="mock-section-head"><h3>Sunday Prep, Weeknight Ready</h3><span>← All lists</span></div><div class="mock-budget">Item budget <b>Under $100</b><span>Adjust list ↗</span></div><div class="mock-filter-row"><span>Already have: cutting board ×</span><span>No plastic containers ×</span></div><div class="mock-list-row">☑　◫　Glass storage containers <b>$39.99</b></div><div class="mock-list-row">☑　▤　Baking sheet <b>$19.99</b></div><div class="mock-list-row">☑　▯　Prep tools <b>$15.99</b></div><div class="mock-summary">3 items selected · Item subtotal <strong>$75.97</strong><br>Sample item prices, before shipping & tax · Compare each item ↗</div><div class="mock-input" style="min-height:50px">“Keep the total under $80 and remove anything I already own.”</div>`;
 if(m.mock==='deals'&&screen===0)body=`<div class="mock-section-head"><h3>Deals for You</h3><span>Recommended ⌄</span></div><div class="mock-input" style="min-height:45px">Adjust my feed: “Christmas picks, no snacks”　↗</div><div class="mock-design-toggle"><button class="${filterMode==='l2'?'active':''}" data-filter-design="l2">方案 A · L2 category</button><button class="${filterMode==='scene'?'active':''}" data-filter-design="scene">方案 B · 使用场景</button></div><div class="mock-filter-row">${(filterMode==='l2'?['All categories ⌄','Headphones','Food storage','Throws & blankets']:['All occasions ⌄','Work & Study','Clean & Organize','More ⌄']).map((x,i)=>`<span class="${i===0?'selected':''}">${x}</span>`).join('')}<span>Price ⌄</span><span>Discount ⌄</span></div><div class="mock-filter-row quick"><span class="selected">✓ Biggest drops · 30 days</span><span class="selected">✓ Price drops only</span><span>Coupons ending soon</span></div><div class="mock-products">${cards}</div><div class="mock-caption">卡面：♡ 喜欢　⋯ 不喜欢 / 为什么推这个；单品卡点击进入 PDP。这里仅示意版式。</div>`;
 if(m.mock==='deals'&&screen===1)body=`<div class="mock-columns"><div class="mock-empty"><span style="font-size:65px">♧</span><br>Same product · selected variant</div><div class="mock-outline"><h4>Noise-canceling headphones</h4><b style="font-size:23px;color:#5c7ea5">$199.99</b><br>New · Black · sample price<br><svg class="mock-curve" viewBox="0 0 300 80" aria-label="价格趋势结构示意"><path d="M0 12H95V23H160V43H228V58H300" fill="none" stroke="#88a8d2" stroke-width="2"/><text x="0" y="77" fill="#9db1c8" font-size="9">30 days ago</text><text x="275" y="77" fill="#9db1c8" font-size="9">Today</text></svg>Best Buy　$199.99　↗<br>Amazon　$219.99　↗<br>Target　$229.99　↗</div></div><div class="mock-filter-row"><span class="selected">Buy at Best Buy ↗</span><span class="selected">♧ Track Price Drop</span></div><div class="mock-hint">盯价 → 确认目标价 → 显示追踪状态 → Autotask；价格曲线与多商家报价继续保留。</div>`;
 if(m.mock==='profile')body=`<div class="mock-prefs"><h3>Shopping preferences</h3><div class="mock-pref-row"><div>Household & restrictions<br><small>Not provided · ask only when useful</small></div><span class="mock-pref-edit">Add / Edit</span></div><div class="mock-pref-row"><div>Memberships<br><small>Prime, Costco, Walmart+…</small></div><span class="mock-pref-edit">Add / Edit</span></div><div class="mock-pref-row"><div>Shopping preferences<br><small>Stores, brands, shipping preferences</small></div><span class="mock-pref-edit">Edit / Remove</span></div><div class="mock-pref-row"><div>Things you told Okiee<br><small>Source and current task shown</small></div><span class="mock-pref-edit">Review / Delete</span></div></div><div class="mock-hint">冷启动：可做 3–4 个轻量问题；没有回答也先给通用热门与当季好价。临时任务与长期记忆分开。</div>`;
 return `<div class="mock-wrap"><div class="mock-label">调整后结构示意 · 仅供评审，价格为示例</div>${body}</div><div class="proposed-note">示意用于表达内容模块、顺序与入口关系；不代表实时 AI、历史价格判定、履约或通知能力已实现。</div>`;}

document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;if(t.dataset.tab){location.hash=t.dataset.tab==='modules'?'modules/'+current:t.dataset.tab;return;}if(t.dataset.module){navigate(t.dataset.module);return;}if(t.dataset.screen!=null){screen=Number(t.dataset.screen);selected=0;render();return;}if(t.dataset.mode){mode=t.dataset.mode;render();return;}if(t.dataset.mark!=null){selectNote(Number(t.dataset.mark));return;}if(t.dataset.note!=null){selectNote(Number(t.dataset.note));return;}if(t.dataset.page){const i=modules.findIndex(m=>m.id===current)+Number(t.dataset.page);if(modules[i])navigate(modules[i].id);return;}if(t.hasAttribute('data-zoom')){const m=modules.find(x=>x.id===current);$('#zoom-content').innerHTML=marksHTML(m,m.screens[screen],true);$('#zoom').showModal();return;}if(t.id==='close-zoom'){$('#zoom').close();return;}if(t.dataset.filterDesign){filterMode=t.dataset.filterDesign;render();return;}if(t.hasAttribute('data-print'))window.print();});
document.addEventListener('click',e=>{const a=e.target.closest('[data-note]');if(a)selectNote(Number(a.dataset.note));});
document.addEventListener('keydown',e=>{if(e.target.closest('[data-note]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectNote(Number(e.target.closest('[data-note]').dataset.note));}if(tab==='modules'&&!$('#zoom').open&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const i=modules.findIndex(m=>m.id===current)+(e.key==='ArrowRight'?1:-1);if(modules[i])navigate(modules[i].id);}});
$('#zoom').addEventListener('click',e=>{if(e.target===$('#zoom'))$('#zoom').close();});window.addEventListener('hashchange',route);route();
</script></body></html>
